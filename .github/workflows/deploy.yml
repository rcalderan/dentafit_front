name: CI

on:
  push:
    branches: [ develop ]
  pull_request:
    branches: [ develop ]

jobs:
  validation:
    runs-on: ubuntu-latest
    environment: develop
    name: Validation

    steps:
    - uses: actions/checkout@v4

    - name: Check if secrets are available
      run: |
        echo "ID is set: ${{ secrets.AWS_ACCESS_KEY_ID != '' }}"
        echo "Region is set: ${{ secrets.AWS_S3_REGION != '' }}"
        echo "API_BASE_URL is set: ${{ secrets.API_BASE_URL != '' }}"
        echo "AWS_S3_BUCKET_URL is set: ${{ secrets.AWS_S3_BUCKET_URL != '' }}"

    - name: Check if backend is online
      continue-on-error: true
      run: |
        echo "🔍 Checking backend availability at ${{ secrets.API_BASE_URL }}..."
        STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 15 "${{ secrets.API_BASE_URL }}/api/auth/public-key" 2>/dev/null) || true
        echo "Response status: $STATUS"
        if [[ "$STATUS" -ge 200 && "$STATUS" -lt 500 ]]; then
          echo "✅ Backend is online (HTTP $STATUS)"
        else
          echo "⚠️ Backend is unreachable (HTTP $STATUS) — deploy will continue but verify backend manually"
        fi

  build:
    runs-on: ubuntu-latest
    environment: develop
    needs: validation
    name: Build

    steps:
    - uses: actions/checkout@v4

    - name: Use Node.js 22.x
      uses: actions/setup-node@v4
      with:
        node-version: 22.x
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Run tests
      run: npm run test

    - name: Build project
      env:
        API_BASE_URL: ${{ secrets.API_BASE_URL }}
        AWS_S3_BUCKET_URL: ${{ secrets.AWS_S3_BUCKET_URL }}
      run: npm run build:prod

    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: dist-build
        path: dist/RentAFit/browser
        retention-days: 1

  deploy-aws:
    runs-on: ubuntu-latest
    environment: develop
    needs: build
    if: github.event_name == 'push'
    name: Deploy AWS

    steps:
    - uses: actions/checkout@v4

    - name: Download build artifacts
      uses: actions/download-artifact@v4
      with:
        name: dist-build
        path: dist/RentAFit/browser

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ secrets.AWS_S3_REGION }}

    - name: Deploy para S3
      uses: jakejarvis/s3-sync-action@master
      with:
        args: --delete
      env:
        AWS_S3_BUCKET: ${{ secrets.AWS_S3_BUCKET }}
        AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
        AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        AWS_REGION: ${{ secrets.AWS_S3_REGION }}
        SOURCE_DIR: 'dist/RentAFit/browser'

  notify:
    needs: [build, deploy-aws]
    runs-on: ubuntu-latest
    if: always()
    steps:
    - name: Notify on Success (Build + Deploy)
      if: success() && needs.deploy-aws.result == 'success' || needs.deploy-aws.result == 'skipped'
      run: |
        echo "✅ Pipeline completed successfully!"
        echo "Branch: ${{ github.ref }}"
        echo "Commit: ${{ github.sha }}"
        DEPLOY_STATUS="${{ needs.deploy-aws.result == 'success' && '✅ Deployed to AWS' || '⏭️  PR - Deploy skipped' }}"
        echo "$DEPLOY_STATUS"

    - name: Notify on Failure
      if: failure()
      run: |
        echo "❌ Pipeline failed!"
        echo "Branch: ${{ github.ref }}"
        echo "Commit: ${{ github.sha }}"
        FAILED_JOB="${{ needs.build.result == 'failure' && 'Build' || 'Deploy' }}"
        echo "Failed job: $FAILED_JOB"
