<div class="winform-container">
    <div class="winform-window">
        <div class="winform-title-bar">
            <span class="winform-title">Roupas</span>
            <div class="winform-controls">
                <button class="win-btn">_</button>
                <button class="win-btn">□</button>
                <button class="win-btn close">X</button>
            </div>
        </div>

        <div class="winform-content">
            <fieldset class="winform-groupbox">
                <legend>Roupas</legend>

                <!-- Absolute positioned elements to mimic WinForms -->
                <div class="win-control" style="top: 24px; left: 20px;">
                    <label class="win-label">codigo</label>
                    <input type="text" class="win-input" style="width: 68px;" [(ngModel)]="clothes().codigo">
                </div>

                <div class="win-control" style="top: 100px; left: 20px;">
                    <label class="win-label">Nome</label>
                    <input type="text" class="win-input uppercase" style="width: 452px;" [(ngModel)]="clothes().nome">
                </div>

                <div class="win-control" style="top: 218px; left: 20px;">
                    <label class="win-label">Tamanho</label>
                    <input type="text" class="win-input uppercase" style="width: 53px;" [(ngModel)]="clothes().tamanho">
                </div>

                <div class="win-control" style="top: 268px; left: 20px;">
                    <label class="win-label">Tipo</label>
                    <select class="win-input" style="width: 255px;" [(ngModel)]="clothes().tipo">
                        <option value=""></option>
                        <option value="Vestido">Vestido</option>
                        <option value="Paletó">Paletó</option>
                    </select>
                </div>

                <div class="win-control" style="top: 24px; left: 500px;">
                    <label class="win-label">Situação</label>
                    <select class="win-input" style="width: 150px;" [(ngModel)]="clothes().situacao">
                        <option value="Disponível">Disponível</option>
                        <option value="Alugado">Alugado</option>
                    </select>
                </div>

                <div class="win-control" style="top: 100px; left: 500px;">
                    <label class="win-label">Cor dominante</label>
                    <div style="display: flex; gap: 2px;">
                        <input type="text" class="win-input" style="width: 120px;" [(ngModel)]="clothes().corDominante">
                        <button class="win-button-classic">...</button>
                    </div>
                </div>

                <div class="win-control" style="top: 150px; left: 500px;">
                    <label class="win-label">Valor</label>
                    <input type="number" class="win-input" style="width: 100px;" [(ngModel)]="clothes().valor">
                </div>

                <div class="win-control" style="top: 150px; left: 620px;">
                    <label class="win-label">Ajuste</label>
                    <input type="number" class="win-input" style="width: 60px;" [(ngModel)]="clothes().ajuste">
                </div>

                <div class="win-control" style="top: 150px; left: 700px;">
                    <label class="win-label">%</label>
                    <input type="number" class="win-input" style="width: 40px;" [(ngModel)]="clothes().percentual">
                </div>

                <div class="win-control" style="top: 150px; left: 760px; flex-direction: row; align-items: center;">
                    <input type="checkbox" id="win-primeiro" [(ngModel)]="clothes().primeiroAluguel">
                    <label for="win-primeiro" class="win-label" style="margin-bottom: 0; margin-left: 5px;">1º Aluguel</label>
                </div>

                <div class="win-control" style="top: 309px; left: 143px;">
                    <div class="win-treeview" style="width: 522px; height: 120px;">
                        <div class="tree-node">[-] NoivaModas</div>
                        <div class="tree-node" style="padding-left: 20px;">[+] Vestido</div>
                        <div class="tree-node" style="padding-left: 20px;">[+] Paletó</div>
                    </div>
                </div>

                <div class="win-control" style="top: 447px; left: 20px;">
                    <div class="win-datagrid" style="width: 960px; height: 150px;">
                        <table>
                            <thead>
                                <tr>
                                    <th>Cód</th>
                                    <th>Nome</th>
                                    <th>Tam</th>
                                    <th>Valor</th>
                                    <th>Situação</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr>
                                    <td>001</td>
                                    <td>VESTIDO NOIVA RENDA</td>
                                    <td>42</td>
                                    <td>1200,00</td>
                                    <td>Disponível</td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>

                <div class="win-control" style="top: 610px; left: 20px;">
                    <label class="win-label">Observação</label>
                    <textarea class="win-input uppercase" style="width: 960px; height: 50px;" [(ngModel)]="clothes().observacao"></textarea>
                </div>

                <!-- Buttons -->
                <div class="win-button-row" style="top: 670px; left: 350px;">
                    <button class="win-button-classic" (click)="save()">Salvar</button>
                    <button class="win-button-classic" (click)="update()">Atualizar</button>
                    <button class="win-button-classic" (click)="delete()">Excluir</button>
                </div>

                <!-- Status Labels -->
                <div class="win-status-labels" style="top: 710px; left: 20px;">
                    <span>N.Loc: 0</span>
                    <span>Base: -</span>
                    <span>L: 0</span>
                    <span>X: 0</span>
                    <span>Cod: -</span>
                    <span>Vai E: 0</span>
                    <span>Vai D: 0</span>
                </div>
            </fieldset>
        </div>
    </div>
</div>
