<div class="dashboard-container">
    <h1>Painel Financeiro</h1>

    <!-- Financial KPIs -->
    <div class="summary-grid">
        <div class="summary-card income">
            <span class="summary-label">Receita (Mês)</span>
            <span class="summary-value">R$ 12.450,00</span>
        </div>
        <div class="summary-card expense">
            <span class="summary-label">Despesas (Mês)</span>
            <span class="summary-value">R$ 4.200,00</span>
        </div>
        <div class="summary-card profit">
            <span class="summary-label">Saldo</span>
            <span class="summary-value">R$ 8.250,00</span>
        </div>
    </div>

    <div class="dashboard-grid">
        <!-- Recent Transactions -->
        <div class="section-card transactions">
            <span class="section-title">Últimos Lançamentos</span>
            <div class="table-responsive">
                <table>
                    <thead>
                        <tr>
                            <th>Data</th>
                            <th>Descrição</th>
                            <th>Valor</th>
                            <th>Tipo</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr>
                            <td>29/12/2023</td>
                            <td>LOCAÇÃO Nº 2024-001</td>
                            <td>R$ 450,00</td>
                            <td><span class="type-badge type-income">C</span></td>
                        </tr>
                        <tr>
                            <td>28/12/2023</td>
                            <td>CONSERTO DE TRAJE</td>
                            <td>R$ 80,00</td>
                            <td><span class="type-badge type-expense">D</span></td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>

        <!-- Cash Flow Mockup -->
        <div class="section-card chart-card">
            <span class="section-title">Fluxo de Caixa (mockup)</span>
            <div class="chart-mockup">
                <div class="bar" style="height: 40%"></div>
                <div class="bar" style="height: 60%"></div>
                <div class="bar" style="height: 35%"></div>
                <div class="bar" style="height: 80%"></div>
                <div class="bar" style="height: 50%"></div>
                <div class="bar" style="height: 90%"></div>
            </div>
        </div>
    </div>
</div>
