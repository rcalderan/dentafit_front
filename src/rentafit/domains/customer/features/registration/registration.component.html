<div class="customer-registration-container" [formGroup]="form" [class.read-only]="isReadOnly()">
    <h1>Cadastro de Cliente</h1>

    <!-- Informações Pessoais -->
    <div class="section-card">
        <div class="section-header">
            <span class="section-title">Informações Pessoais</span>
            <div class="header-actions">
                <button class="header-btn" (click)="clear()" title="Limpar">🧹</button>
                <button class="header-btn" (click)="close()" title="Fechar">❌</button>
            </div>
        </div>
        <div class="form-grid">
            <div class="input-group col-4">
                <label>Código</label>
                <div style="display: flex; gap: 0.5rem; align-items: center;">
                    <input type="text" [placeholder]="form.value.legacyId!=null ? form.value.legacyId : ''" formControlName="legacyId"
                        (keydown)="findByLegacyId($event, form.value.legacyId)" style="flex: 1;">
                    @if (isReadOnly()) {
                        <button class="header-btn btn-edit-trigger" (click)="enableEditing()" title="Editar">✏️</button>
                    }
                </div>
            </div>
            <!-- <div class="input-group col-1"
                style="flex-direction: row; align-items: center; gap: 0.5rem; justify-content: flex-end;">
                <input type="checkbox" id="auth-check" formControlName="isAuthenticated">
                <label for="auth-check" style="color: var(--text-color); margin-top: 4px;">isAuthenticated</label>
            </div> -->
            <div class="input-group col-12">
                <label>Nome Completo</label>
                <input type="text" class="uppercase" formControlName="name">
            </div>
            <!-- <div class="input-group col-4">
                <label>Data de Nascimento</label>
                <input type="date" formControlName="nascimento">
            </div> -->
            <div class="input-group col-3">
                <label>CPF</label>
                <input type="text" placeholder="000.000.000-00" formControlName="document"
                (keydown)="findByDocument($event, form.value.document)">
            </div>
            <!-- <div class="input-group col-8">
                <label>Gênero</label>
                <div class="radio-group">
                    <label class="radio-option"><input type="radio" value="male" formControlName="sexo"> Masculino</label>
                    <label class="radio-option"><input type="radio" value="female" formControlName="sexo"> Feminino</label>
                    <label class="radio-option"><input type="radio" value="other" formControlName="sexo"> Outro</label>
                </div>
            </div> 
            <div class="input-group col-4">
                <label>RG</label>
                <input type="text" formControlName="rg">
            </div> -->
            <div class="input-group col-6">
                <label>E-mail</label>
                <input type="email" formControlName="email">
            </div>

        </div>
        <!-- Endereço -->
        <div class="section-card" style=" background-color:#afb1c9;">
            <div formGroupName="address">
                <span class="section-title">Endereço</span>
                <div class="form-grid">
                    <div class="input-group col-4">
                        <label>CEP</label>
                        <input type="text" formControlName="zipCode"
                        (keydown)="findAddressByZipCode($event, form.get('address')?.value.zipCode)">
                    </div>
                    <div class="input-group col-12">
                        <label>Logradouro</label>
                        <input type="text" class="uppercase" formControlName="street">
                    </div>
                    <div class="input-group col-6">
                        <label>Bairro</label>
                        <input type="text" class="uppercase" formControlName="neighborhood">
                    </div>
                    <div class="input-group col-4">
                        <label>Cidade</label>
                        <input type="text" class="uppercase" formControlName="city">
                    </div>
                    <div class="input-group col-2">
                        <label>Estado</label>
                        <input type="text" class="uppercase" maxlength="2" formControlName="state">
                    </div>

                </div>

            </div>
            <div class="input-group col-3">
                <label>Número</label>
                <input type="text" class="uppercase" formControlName="number">
            </div>

            <div class="input-group col-3">
                <label>Complemento</label>
                <input type="text" class="uppercase" formControlName="complement">
            </div>

        </div>




        <div class="input-group col-12">
            <label>Observações</label>
            <textarea rows="3" class="uppercase" formControlName="notes"></textarea>
        </div>
    </div>


    <!-- Contato -->
    <div class="section-card">
        <span class="section-title">Contato</span>
        <div class="form-grid" formArrayName="phones">
            <div class="input-group col-3">
                <label>Telefone 1</label>
                <input type="tel" [formControlName]="0">
            </div>
            <div class="input-group col-3">
                <label>Telefone 2</label>
                <input type="tel" [formControlName]="1">
            </div>

        </div>
    </div>

    <!-- Actions -->
    <div class="actions">
        <button class="btn btn-save" (click)="save()" [disabled]="form.invalid || isReadOnly()">Salvar</button>
        <button class="btn btn-delete" [disabled]="form.invalid || isReadOnly()">Excluir</button>
    </div>

    @if (errorMessage()) {
        <rentafit-modal 
            title="Atenção" 
            [message]="errorMessage() ?? ''" 
            type="error" 
            (close)="clearError()">
        </rentafit-modal>
    }
</div>
