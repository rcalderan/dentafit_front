<div class="customer-registration-container">
    <h1>Cadastro de Cliente</h1>

    <!-- Informações Pessoais -->
    <div class="section-card">
        <span class="section-title">Informações Pessoais</span>
        <div class="form-grid">
            <div class="input-group col-8">
                <label>Nome Completo</label>
                <input type="text" class="uppercase" [(ngModel)]="customer().nome">
            </div>
            <div class="input-group col-4">
                <label>Data de Nascimento</label>
                <input type="date" [(ngModel)]="customer().nascimento">
            </div>
            <div class="input-group col-4">
                <label>CPF</label>
                <input type="text" placeholder="000.000.000-00" [(ngModel)]="customer().cpf">
            </div>
            <div class="input-group col-8">
                <label>Gênero</label>
                <div class="radio-group">
                    <label class="radio-option"><input type="radio" name="gender" value="male" [(ngModel)]="customer().sexo"> Masculino</label>
                    <label class="radio-option"><input type="radio" name="gender" value="female" [(ngModel)]="customer().sexo"> Feminino</label>
                    <label class="radio-option"><input type="radio" name="gender" value="other" [(ngModel)]="customer().sexo"> Outro</label>
                </div>
            </div>
            <div class="input-group col-4">
                <label>RG</label>
                <input type="text" [(ngModel)]="customer().rg">
            </div>
            <div class="input-group col-4">
                <label>Código</label>
                <input type="text" placeholder="Auto" readonly [value]="customer().id">
            </div>
            <div class="input-group col-4"
                style="flex-direction: row; align-items: center; gap: 0.5rem; justify-content: flex-end;">
                <input type="checkbox" id="auth-check" [(ngModel)]="customer().autenticacao">
                <label for="auth-check" style="color: var(--text-color); margin-top: 4px;">Autenticado</label>
            </div>
        </div>
    </div>

    <!-- Endereço -->
    <div class="section-card">
        <span class="section-title">Endereço</span>
        <div class="form-grid">
            <div class="input-group col-9">
                <label>Logradouro</label>
                <input type="text" class="uppercase" [(ngModel)]="customer().endereco.logradouro">
            </div>
            <div class="input-group col-3">
                <label>Número</label>
                <input type="text" class="uppercase" [(ngModel)]="customer().endereco.numero">
            </div>
            <div class="input-group col-4">
                <label>Bairro</label>
                <input type="text" class="uppercase" [(ngModel)]="customer().endereco.bairro">
            </div>
            <div class="input-group col-4">
                <label>Cidade</label>
                <input type="text" class="uppercase" [(ngModel)]="customer().endereco.cidade">
            </div>
            <div class="input-group col-2">
                <label>Estado (UF)</label>
                <input type="text" class="uppercase" maxlength="2" [(ngModel)]="customer().endereco.uf">
            </div>
            <div class="input-group col-2">
                <label>CEP</label>
                <input type="text" [(ngModel)]="customer().endereco.cep">
            </div>
        </div>
    </div>

    <!-- Contato -->
    <div class="section-card">
        <span class="section-title">Contato</span>
        <div class="form-grid">
            <div class="input-group col-3">
                <label>Telefone 1</label>
                <input type="tel" [(ngModel)]="customer().fones[0]">
            </div>
            <div class="input-group col-3">
                <label>Telefone 2</label>
                <input type="tel" [(ngModel)]="customer().fones[1]">
            </div>
            <div class="input-group col-6">
                <label>E-mail</label>
                <input type="email" [(ngModel)]="customer().email">
            </div>
            <div class="input-group col-12">
                <label>Observações</label>
                <textarea rows="3" class="uppercase" [(ngModel)]="customer().observacao"></textarea>
            </div>
        </div>
    </div>

    <!-- Actions -->
    <div class="actions">
        <button class="btn btn-save">Salvar</button>
        <button class="btn btn-update">Atualiza</button>
        <button class="btn btn-delete">Excluir</button>
    </div>
</div>
