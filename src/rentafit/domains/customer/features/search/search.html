<div class="search-container">
    <h1>Pesquisa de Clientes</h1>

    <!-- Search Filters -->
    <div class="section-card search-card">
        <div class="search-flex">
            <div class="input-group flex-grow">
                <label>Nome ou CPF</label>
                <div class="input-with-icon">
                    <input type="text" placeholder="Pesquisar..." class="uppercase">
                    <i class="search-icon">🔍</i>
                </div>
            </div>
            <button class="btn btn-save search-btn">Pesquisar</button>
        </div>
    </div>

    <!-- Results Table -->
    <div class="section-card table-card">
        <span class="section-title">Resultados</span>
        <div class="table-responsive">
            <table>
                <thead>
                    <tr>
                        <th>Código</th>
                        <th>Nome</th>
                        <th>CPF</th>
                        <th>Cidade</th>
                        <th>Ações</th>
                    </tr>
                </thead>
                <tbody>
                    <!-- Mock Data for Design -->
                    <tr>
                        <td>001</td>
                        <td>RICHARD CALDERAN</td>
                        <td>000.000.000-00</td>
                        <td>SÃO PAULO</td>
                        <td>
                            <div class="table-actions">
                                <button class="action-btn edit-btn">✏️</button>
                                <button class="action-btn view-btn">👁️</button>
                            </div>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
