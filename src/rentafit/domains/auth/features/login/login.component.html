<div class="login-container">
    <div class="login-card">
        <h2>Bem vindo a {{ title() }}</h2>
        
        @if (errorMessage()) {
        <div class="error-message">
            {{ errorMessage() }}
        </div>
        }

        <div class="form-group">
            <label for="username">Username</label>
            <input 
                type="text" 
                id="username" 
                [(ngModel)]="username"
                placeholder="Enter username (admin)"
                [disabled]="isLoading()"
                (keyup.enter)="login()">
        </div>
        <div class="form-group">
            <label for="password">Password</label>
            <input 
                type="password" 
                id="password" 
                [(ngModel)]="password"
                placeholder="Enter password"
                [disabled]="isLoading()"
                (keyup.enter)="login()">
        </div>
        <button 
            (click)="login()" 
            [disabled]="isLoading()">
            {{ isLoading() ? 'Autenticando...' : 'Sign In' }}
        </button>
        <p class="register-link">
            Não tem conta? <a routerLink="/auth/register">Criar conta</a>
        </p>
    </div>
</div>
