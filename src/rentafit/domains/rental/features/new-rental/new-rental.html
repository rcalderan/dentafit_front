<div class="new-rental-container">
    <h1>Nova Locação</h1>

    <div class="main-grid">
        <!-- Left Column: Customer and Dates -->
        <div class="left-column">
            <div class="section-card customer-section">
                <span class="section-title">Cliente</span>
                <div class="input-group">
                    <label>Buscar Cliente (Nome ou CPF)</label>
                    <div class="search-input">
                        <input type="text" placeholder="Pesquisar..." class="uppercase">
                        <button class="icon-btn">🔍</button>
                    </div>
                </div>
                <div class="customer-info" style="margin-top: 1rem;">
                    <p><strong>RICHARD CALDERAN</strong></p>
                    <p class="text-muted">CPF: 000.000.000-00</p>
                </div>
            </div>

            <div class="section-card date-section">
                <span class="section-title">Datas</span>
                <div class="form-grid">
                    <div class="input-group col-6">
                        <label>Data de Uso</label>
                        <input type="date">
                    </div>
                    <div class="input-group col-6">
                        <label>Data de Devolução</label>
                        <input type="date">
                    </div>
                </div>
            </div>
        </div>

        <!-- Right Column: Products and Totals -->
        <div class="right-column">
            <div class="section-card products-section">
                <span class="section-title">Itens da Locação</span>
                <div class="input-group">
                    <label>Adicionar Produto (Código)</label>
                    <div class="search-input">
                        <input type="text" placeholder="Código..." class="uppercase">
                        <button class="icon-btn">➕</button>
                    </div>
                </div>

                <div class="items-list" style="margin-top: 1.5rem;">
                    <div class="item-row">
                        <div class="item-desc">
                            <span class="item-name">SMOKING PRETO CLASSIC</span>
                            <span class="item-meta">TAM: 42 | COR: PRETO</span>
                        </div>
                        <span class="item-price">R$ 250,00</span>
                        <button class="remove-btn">✕</button>
                    </div>
                </div>

                <div class="totals-section">
                    <div class="total-row">
                        <span>Subtotal</span>
                        <span>R$ 250,00</span>
                    </div>
                    <div class="total-row discount">
                        <span>Desconto</span>
                        <input type="text" value="0,00" class="mini-input">
                    </div>
                    <div class="total-row final">
                        <span>Total</span>
                        <span>R$ 250,00</span>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="actions">
        <button class="btn btn-save">Finalizar Locação</button>
        <button class="btn btn-update">Salvar Proposta</button>
    </div>
</div>
